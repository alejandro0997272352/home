services:
  - type: web
    name: tutorias
    runtime: php
    region: oregon
    plan: free
    buildCommand: composer install --optimize-autoloader --no-dev
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: tutorias-db
          property: connectionString
      - key: APP_URL
        value: https://tutorias.onrender.com
      - key: SESSION_DRIVER
        value: file
      - key: LOG_CHANNEL
        value: stderr
      - key: QUEUE_CONNECTION
        value: sync
      - key: DB_SSLMODE
        value: require

databases:
  - name: tutorias-db
    databaseName: tutorias
    plan: free
    region: oregon
    postgresMajorVersion: 16
